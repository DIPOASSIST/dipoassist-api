version: '3.9'
name: dipoassist

services:
  db:
    image: mysql:8.0
    container_name: dipoassist-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db-dipoassist
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dipoassist-api
    restart: always
    env_file: .env
    ports:
      - '9000:9000'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  db_data:
