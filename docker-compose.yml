version: '3.9'
name: dipoassist

services:
  db:
    image: mysql:8.0
    container_name: dipoassist-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_dipoassist
      TZ: Asia/Jakarta
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: brilliahib/dipoassist-api:latest
    container_name: dipoassist-api
    restart: always
    env_file: .env
    ports:
      - '9000:9000'
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  db_data:
    driver: local
